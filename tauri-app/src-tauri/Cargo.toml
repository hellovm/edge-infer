[package]
name = "edge-gui"
version = "0.2.1"
edition = "2021"
description = "edge-infer Tauri GUI: 三层卸载多硬件推理工作台"
license = "Apache-2.0"

# Keep the GUI crate out of the parent edge-infer cargo workspace.
[workspace]

[lib]
name = "edge_gui_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
