<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>edge-infer · 端侧 AI 工作台</title>
<style>
  :root{
    --bg:#f6f7f9; --side:#ffffff; --panel:#ffffff; --panel2:#f2f3f5;
    --fg:#1c1f26; --dim:#6b7280; --line:#e5e7eb; --line2:#eef0f3;
    --brand:#2f6bff; --brand-soft:#eaf1ff; --nvidia:#3fa914; --npu:#2f8fff;
    --cpu:#8b5cf6; --ssd:#f2912f; --ok:#12b76a; --warn:#f59e0b; --err:#ef4444;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.55 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:264px 1fr;height:100vh;overflow:hidden}

  /* ---------- sidebar ---------- */
  .side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
  .side .brand{display:flex;align-items:center;gap:9px;padding:16px 16px 12px;font-weight:650;font-size:15px}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--brand),#7aa2ff);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
  .brand .sub{font-size:11px;color:var(--dim);font-weight:400;margin-left:2px}
  .newchat{margin:0 12px 10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;
    display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:550;color:var(--fg)}
  .newchat:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  .navlabel{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:10px 18px 6px}
  .conv{flex:1;overflow:auto;padding:0 8px 8px;min-height:0}
  .citem{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;border-radius:8px;font-size:13px;color:#374151;cursor:pointer;margin-bottom:2px}
  .citem:hover{background:var(--panel2)}
  .citem.active{background:var(--brand-soft);color:var(--brand)}
  .citem .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .citem .acts{display:none;gap:2px}
  .citem:hover .acts{display:flex}
  .citem .acts span{padding:2px 5px;border-radius:5px;font-size:12px;opacity:.7}
  .citem .acts span:hover{background:rgba(0,0,0,.08);opacity:1}
  .citem .arch{color:var(--dim);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 3px}
  /* bottom menu */
  .sidefoot{border-top:1px solid var(--line);padding:8px}
  .menubtn{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:550;font-size:13.5px}
  .menubtn:hover{background:var(--panel2)}
  .menubtn .ico{width:18px;text-align:center}
  .svcline{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);padding:6px 12px 2px}
  .popmenu{position:absolute;left:8px;right:8px;bottom:96px;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 8px 30px rgba(16,24,40,.16);padding:6px;display:none;z-index:40}
  .popmenu.show{display:block}
  .popmenu .mi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
  .popmenu .mi:hover{background:var(--brand-soft);color:var(--brand)}
  .popmenu .mi .ico{width:18px;text-align:center;font-size:15px}

  /* ---------- main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff}
  .topbar .title{font-weight:600}
  .topbar .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;
    border:1px solid var(--line);background:#fff;color:var(--dim)}
  .chip.on{color:var(--ok);border-color:rgba(18,183,106,.35);background:rgba(18,183,106,.06)}
  .chip.off{color:var(--err);border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.06)}
  .viewwrap{flex:1;overflow:auto;min-height:0}

  /* ---------- chat ---------- */
  .chatwrap{display:flex;flex-direction:column;height:100%;min-height:0}
  .msgs{flex:1;overflow:auto;padding:22px 0}
  .msgs .inner{max-width:780px;margin:0 auto;padding:0 22px}
  .msg{display:flex;gap:12px;margin-bottom:20px}
  .msg .av{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  .msg.user .av{background:#64748b}
  .msg.ai .av{background:linear-gradient(135deg,var(--brand),#7aa2ff)}
  .msg .bubble{flex:1;min-width:0}
  .msg .who{font-size:12px;color:var(--dim);margin-bottom:5px}
  .msg .body{white-space:pre-wrap;word-break:break-word}
  .msg.ai .body{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .meta{margin-top:6px;font-size:11.5px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
  .cursor::after{content:"▋";animation:blink 1s steps(2) infinite;color:var(--brand)}
  @keyframes blink{50%{opacity:0}}
  .thinkbox{margin:0 0 8px;border:1px dashed var(--line);border-radius:8px;background:var(--panel2);font-size:12.5px;color:var(--dim)}
  .thinkbox summary{cursor:pointer;padding:6px 10px;font-weight:550;color:var(--dim)}
  .thinkbox .tc{padding:0 12px 10px;white-space:pre-wrap}
  .empty{max-width:780px;margin:0 auto;padding:56px 22px;text-align:center;color:var(--dim)}
  .empty h2{color:var(--fg);font-size:22px;margin:0 0 8px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;text-align:left}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
  .card b{display:block;margin-bottom:3px;font-size:13.5px}
  .card span{font-size:12.5px;color:var(--dim)}
  .composer{border-top:1px solid var(--line);background:#fff;padding:14px 0 16px}
  .composer .inner{max-width:820px;margin:0 auto;padding:0 22px}
  .attbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .att{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);max-width:220px}
  .att .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att img{width:22px;height:22px;object-fit:cover;border-radius:5px}
  .att b{font-weight:550} .att .x{cursor:pointer;color:var(--dim);padding:0 2px}
  .att .x:hover{color:var(--err)}
  .cbox{border:1px solid var(--line);border-radius:18px;background:#fff;padding:10px 12px 8px;box-shadow:0 2px 14px rgba(16,24,40,.06);transition:.15s}
  .cbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft),0 2px 14px rgba(16,24,40,.06)}
  .cbox textarea{width:100%;border:none;outline:none;resize:none;font:inherit;max-height:180px;min-height:26px;padding:2px 2px 6px;background:transparent;box-sizing:border-box}
  .cbar{display:flex;align-items:center;gap:8px;padding-top:2px}
  .cbar .grow{flex:1}
  .roundbtn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1;transition:.15s}
  .plus{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
  .plus:hover{background:#eef1f6}
  .plus.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
  .send2{background:var(--brand);color:#fff}
  .send2:hover{filter:brightness(1.06)}
  .send2:disabled{opacity:.45;cursor:not-allowed}
  .send2.busy{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .modelpick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px;cursor:pointer;color:var(--fg);max-width:300px}
  .modelpick:hover{border-color:var(--brand)}
  .modelpick .mi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
  .modelpick .caret{color:var(--dim);font-size:10px}
  .modelpick .be{font-size:10px;padding:1px 5px;border-radius:5px;background:var(--panel2);color:var(--dim)}
  .popmenu2{position:absolute;bottom:52px;left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(16,24,40,.16);padding:6px;min-width:230px;display:none;z-index:40}
  .popmenu2.show{display:block}
  .popmenu2 .pm{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
  .popmenu2 .pm:hover{background:var(--panel2)}
  .popmenu2 .pm .ic{font-size:15px;line-height:1.2}
  .popmenu2 .pm small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
  .modellist{position:absolute;bottom:52px;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(16,24,40,.16);padding:6px;min-width:290px;max-height:320px;overflow:auto;display:none;z-index:40}
  .modellist.show{display:block}
  .modellist .grp{font-size:10.5px;color:var(--dim);padding:6px 10px 3px;text-transform:uppercase;letter-spacing:.4px}
  .modellist .mm{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
  .modellist .mm:hover{background:var(--panel2)}
  .modellist .mm.sel{background:var(--brand-soft)}
  .modellist .mm .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modellist .mm .sz{color:var(--dim);font-size:11px}
  .modellist .mm .bk{font-size:9.5px;padding:1px 5px;border-radius:5px;background:var(--panel2);color:var(--dim)}
  .hint{font-size:11.5px;color:var(--dim);margin-top:9px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
  .hint label{cursor:pointer;display:inline-flex;align-items:center;gap:5px}

  /* ---------- panels (overlay) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(16,24,40,.35);display:none;z-index:60;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--bg);border-radius:16px;width:min(1000px,96vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modalhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff;border-radius:16px 16px 0 0;position:sticky;top:0}
  .modalhead h3{margin:0;font-size:16px;flex:1}
  .panel{max-width:920px;margin:0 auto;padding:20px}
  .sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .sec h3{margin:0 0 4px;font-size:15px}
  .sec .desc{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .frow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line2);gap:12px}
  .frow:last-child{border-bottom:none}
  .frow .lbl{font-size:13.5px}
  .frow .lbl small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  input[type=text],input[type=password],select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;background:#fff;min-width:200px}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .switch{width:42px;height:24px;border-radius:99px;background:#d1d5db;position:relative;cursor:pointer;transition:.15s;flex:none}
  .switch.on{background:var(--brand)}
  .switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on i{left:20px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.primary:hover{opacity:.92;color:#fff}
  .btn.danger{color:var(--err);border-color:rgba(239,68,68,.4)}
  .btn.danger:hover{background:rgba(239,68,68,.08);color:var(--err);border-color:var(--err)}
  .devs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .dev{border:1.5px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;background:#fff;position:relative}
  .dev:hover{border-color:#c7d2fe} .dev.sel{border-color:var(--brand);background:var(--brand-soft)}
  .dev .nm{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
  .dev .cap{color:var(--dim);font-size:12px;margin-top:5px}
  .dev .tag{position:absolute;top:10px;right:10px;font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--dim)}
  .dev.sel .tag{background:var(--brand);color:#fff}
  .stat-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line2)}
  .stat-row:last-child{border:none} .stat-row .k{color:var(--dim)}
  .bar{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:6px 0}
  .bar i{display:block;height:100%;border-radius:5px}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .b-vram{background:rgba(63,169,20,.12);color:var(--nvidia)}
  .b-ram{background:rgba(47,143,255,.12);color:var(--npu)}
  .b-ssd{background:rgba(242,145,47,.14);color:var(--ssd)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
    padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12px}
  pre.log{background:#0f1117;color:#d6e2f0;border-radius:10px;padding:12px;font-size:12px;overflow:auto;max-height:320px;white-space:pre-wrap;margin:0}
  .step{border-left:3px solid var(--brand);padding:6px 10px;margin:6px 0;background:var(--brand-soft);border-radius:0 8px 8px 0;font-size:12.5px}
  .step .t{font-weight:600;color:var(--brand)}
  /* model catalog */
  .catalog{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .catcol{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .catcol .ch{padding:10px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
  .catcol .cb{padding:10px}
  .mcard{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px;cursor:pointer;transition:.15s;position:relative}
  .mcard:last-child{margin-bottom:0}
  .mcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
  .mcard .mt{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .mcard .ms{font-size:11.5px;color:var(--dim);margin-top:2px;word-break:break-all}
  .mcard .mh{margin-top:7px;font-size:11.5px;color:var(--npu);background:rgba(47,143,255,.07);padding:5px 7px;border-radius:6px;line-height:1.4}
  .mcard .mtags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
  .mcard .tg{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--dim)}
  .mcard .installed{position:absolute;top:9px;right:9px;font-size:10.5px;color:var(--ok);font-weight:600}
  .mcard.loading{opacity:.6;pointer-events:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#d5d9e0;border-radius:5px;border:2px solid transparent;background-clip:content-box}
</style>
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <div class="brand"><div class="logo">e</div><div>edge-infer<span class="sub">端侧推理</span></div></div>
    <div class="newchat" onclick="newChat()">＋ 新建对话</div>
    <div class="navlabel" id="convLabel">会话</div>
    <div class="conv" id="convList"></div>

    <div class="popmenu" id="popmenu">
      <div class="mi" onclick="openPanel('projects')"><span class="ico">📁</span>项目</div>
      <div class="mi" onclick="openPanel('agent')"><span class="ico">🤖</span>Agent 工作区</div>
      <div class="mi" onclick="openPanel('tiers')"><span class="ico">🧱</span>三层方案</div>
      <div class="mi" onclick="openPanel('models')"><span class="ico">📦</span>模型</div>
      <div class="mi" onclick="openPanel('settings')"><span class="ico">⚙️</span>设置</div>
    </div>

    <div class="svcline"><span class="dot" id="footDot" style="background:#c7ccd4"></span><span id="footText">检测服务中…</span></div>
    <div class="sidefoot">
      <div class="menubtn" onclick="toggleMenu(event)"><span class="ico">☰</span>菜单<span style="flex:1"></span><span class="ico">⋯</span></div>
    </div>
  </aside>

  <!-- ============ MAIN (chat only) ============ -->
  <div class="main">
    <div class="topbar">
      <div class="title" id="chatTitle">对话</div>
      <div class="spacer"></div>
      <span class="chip" id="chipDevice">设备 –</span>
      <span class="chip" id="chipSvc">服务 –</span>
    </div>

    <div class="viewwrap">
      <div class="chatwrap">
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <div class="inner">
            <div class="attbar" id="attBar"></div>
            <div class="cbox" style="position:relative">
              <textarea id="prompt" rows="1" placeholder="给 edge-infer 发送消息…（Enter 发送，Shift+Enter 换行）"
                oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
              <div class="cbar">
                <span style="position:relative">
                  <button class="roundbtn plus" id="plusBtn" title="添加附件" onclick="toggleAttMenu(event)">＋</button>
                  <div class="popmenu2" id="attMenu">
                    <div class="pm" onclick="pickFiles('file')"><span class="ic">📄</span><span>上传文件<small>文本 / 代码 / 数据文件</small></span></div>
                    <div class="pm" onclick="pickFiles('image')"><span class="ic">🖼️</span><span>上传图片<small>截图 / 照片（多模态）</small></span></div>
                    <div class="pm" onclick="pickFiles('folder')"><span class="ic">📁</span><span>上传文件夹<small>整个目录（保留结构）</small></span></div>
                  </div>
                </span>
                <input type="file" id="fileInput" multiple style="display:none" onchange="onFiles(event)">
                <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="onFiles(event)">
                <input type="file" id="dirInput" webkitdirectory directory multiple style="display:none" onchange="onFiles(event)">
                <span class="grow"></span>
                <span style="position:relative">
                  <button class="modelpick" id="modelPickBtn" onclick="toggleModelMenu(event)">
                    <span>🧠</span><span class="mi" id="modelPickName">默认模型</span><span class="be" id="modelPickBackend"></span><span class="caret">▼</span>
                  </button>
                  <div class="modellist" id="modelMenu"></div>
                </span>
                <button class="roundbtn send2" id="sendBtn" title="发送" onclick="send()">➤</button>
              </div>
            </div>
            <div class="hint">
              <label><input type="checkbox" id="streamOn" checked> 流式输出</label>
              <label><input type="checkbox" id="thinkOn"> 思考模式</label>
              <label><input type="checkbox" id="agentOn"> Agent 模式</label>
              <span id="statLine" class="mono"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ OVERLAY PANELS ============ -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modalhead"><h3 id="modalTitle">面板</h3><button class="btn" onclick="closePanel()">关闭</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const _qp = new URLSearchParams(location.search).get("api");
const _isTauriEnv = location.protocol === "tauri:" || (location.protocol === "http:" && location.hostname === "tauri.localhost") || !!window.__TAURI__;
let API = _qp || (_isTauriEnv ? "http://127.0.0.1:8080" : location.origin);
const API_CANDIDATES = [_qp, "http://127.0.0.1:8080", "http://localhost:8080", location.origin].filter(Boolean);
const IS_TAURI = location.protocol === "tauri:" || (location.protocol === "http:" && location.hostname === "tauri.localhost") || !!window.__TAURI__;
function isAssetOrigin(b){
  return /^(tauri:|file:)/.test(b) || /tauri\.localhost/.test(b);
}
async function probeAPI(){
  const seen = new Set();
  for(const base of API_CANDIDATES){
    const b = base.replace(/\/$/,"");
    if(seen.has(b)) continue; seen.add(b);
    if(isAssetOrigin(b)) continue;
    try{
      const r = await fetch(b+"/health",{signal:AbortSignal.timeout(2500)});
      if(!r.ok) continue;
      const ct=(r.headers.get("content-type")||"").toLowerCase();
      if(!ct.includes("json")) continue;
      const j=await r.json();
      if(j && j.ok===true){ API=b; return true; }
    }catch(e){}
  }
  return false;
}

async function send(){
  if(state.busy) return;
  const t=$("prompt").value.trim(); if(!t && !state.attachments.length) return;
  state.agentMode=$("agentOn").checked; state.thinking=$("thinkOn").checked;
  let c=curConv(); if(!c){ newChat(); c=curConv(); }
  const atts=state.attachments.slice();
  if(c.msgs.length===0){ c.title=t.slice(0,18)||(atts[0]?.name||"新对话"); renderConvs(); }
  c.msgs.push({role:"user",content:t,atts:atts.map(a=>a.name)});
  $("prompt").value=""; autoGrow($("prompt")); state.attachments=[]; renderAtts();
  state.busy=true; $("sendBtn").disabled=true; $("sendBtn").classList.add("busy"); $("sendBtn").textContent="◼";
  setStat(""); LS.write("convs",state.convs);
  renderChat();
  const inner=document.querySelector("#msgs .inner");
  const ai=document.createElement("div"); ai.className="msg ai";
  ai.innerHTML=`<div class="av">e</div><div class="bubble"><div class="who">edge-infer</div>
    <div class="thinkwrap"></div><div class="body cursor"></div><div class="meta"><span class="runstatus">生成中…</span></div></div>`;
  inner.appendChild(ai);
  const body=ai.querySelector(".body"), meta=ai.querySelector(".meta"), thinkwrap=ai.querySelector(".thinkwrap");
  const scroll=()=>{const b=$("msgs");b.scrollTop=b.scrollHeight};
  let text="", think="", t0=performance.now(), inThink=false;

  const splitThink=(chunk)=>{
    let out="";
    let i=0;
    while(i<chunk.length){
      if(!inThink){
        const k=chunk.indexOf("<think",i);
        if(k===-1){ out+=chunk.slice(i); break; }
        out+=chunk.slice(i,k);
        const gt=chunk.indexOf(">",k);
        inThink=true; i=(gt===-1)?chunk.length:gt+1;
      } else {
        const k=chunk.indexOf("</think",i);
        if(k===-1){ think+=chunk.slice(i); break; }
        think+=chunk.slice(i,k);
        const gt=chunk.indexOf(">",k);
        inThink=false; i=(gt===-1)?chunk.length:gt+1;
      }
    }
    return out;
  };
  const paintThink=()=>{ if(think.trim()) thinkwrap.innerHTML=`<details class="thinkbox" open><summary>💭 思考过程</summary><div class="tc">${esc(think)}</div></details>`; };
  const thinkingOn = state.thinking;  // 本次请求是否开启思考

  try{
    if(state.agentMode){
      meta.innerHTML='<span class="runstatus">Agent 运行中…</span>';
      const r=await fetch(API+"/agent/chat",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:t+(atts.length?"\n\n[附件]"+atts.map(a=>a.name).join("、"):""),max_steps:6})});
      const j=await r.json();
      if(!j.steps||!j.steps.length) meta.innerHTML="";
      else meta.innerHTML=j.steps.map(s=>`🔧 ${esc(s.tool)}`).join(" → ");
      text=j.answer||"(无回答)";
      body.classList.remove("cursor"); body.textContent=text;
    } else if(state.stream && !state.useExternal){
      const payload={model:"qwen",model_id:state.modelId,messages:[{role:"user",content:t}],max_tokens:512,temperature:0,stream:true,
        device:state.device,enable_thinking:state.thinking,
        attachments:atts.filter(a=>a.kind!=="image").map(a=>({name:a.name,content:a.content})),
        images:atts.filter(a=>a.kind==="image"&&a.image).map(a=>a.image)};
      const resp=await fetch(API+"/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="", usage=null;
      while(true){
        const {done,value}=await reader.read(); if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split("\n"); buf=lines.pop();
        for(const line of lines){
          if(!line.startsWith("data: ")) continue;
          const data=line.slice(6).trim(); if(data==="[DONE]") continue;
          try{ const j=JSON.parse(data);
            if(j.usage) usage=j.usage;
            if(j.notice) toast(j.notice);
            if(j.error) toast("推理错误："+j.error);
            const d=j.choices?.[0]?.delta?.content;
            if(d){ text+=splitThink(d); paintThink(); body.textContent=text; scroll(); }
          }catch(e){}
        }
      }
      body.classList.remove("cursor");
      text=text.replace(/<think[^>]*>\s*<\/think[^>]*>/g,"").replace(/^\s+/, "");
      body.textContent=text;
      const dt=(performance.now()-t0)/1000;
      meta.innerHTML = usage ? tokMeta(usage) : `<span>流式 · ${dt.toFixed(1)}s</span>`;
      if(usage) setStat(`本次 ${usage.completion_tokens||0} tokens · ${usage.est_tok_s||0} tok/s · ${usage.device||""}`);
    } else {
      let url, headers={"Content-Type":"application/json"}, payload;
      if(state.useExternal && state.ext.base){
        url=state.ext.base.replace(/\/$/,"")+"/chat/completions";
        headers["Authorization"]="Bearer "+(state.ext.key||"");
        payload={model:state.ext.model||"gpt-4o-mini",messages:[{role:"user",content:t}]};
      }else{
        url=API+"/v1/chat/completions";
        payload={model:"qwen",model_id:state.modelId,messages:[{role:"user",content:t}],max_tokens:512,temperature:0,
          device:state.device,enable_thinking:state.thinking,
          attachments:atts.filter(a=>a.kind!=="image").map(a=>({name:a.name,content:a.content})),
          images:atts.filter(a=>a.kind==="image"&&a.image).map(a=>a.image)};
      }
      const j=await (await fetch(url,{method:"POST",headers,body:JSON.stringify(payload)})).json();
      let raw=j.choices?.[0]?.message?.content||JSON.stringify(j);
      text=splitThink(raw).replace(/<think[^>]*>\s*<\/think[^>]*>/g,"").replace(/^\s+/, "");
      paintThink();
      const u=j.usage||{};
      meta.innerHTML=(state.useExternal?("外接 API · "+(state.ext.model||"")):(tokMeta(u)||""));
      if(u.est_tok_s) setStat(`本次 ${u.completion_tokens||0} tokens · ${u.est_tok_s} tok/s · ${u.device||""}`);
      body.classList.remove("cursor"); body.textContent=text;
    }
    c.msgs.push({role:"assistant",content:text,think:thinkingOn?think:"",thinking:thinkingOn,meta:meta.innerHTML});
  }catch(e){
    text="（推理失败）"+e.message; body.classList.remove("cursor"); body.textContent=text;
    c.msgs.push({role:"assistant",content:text});
  }
  state.busy=false; $("sendBtn").disabled=false; $("sendBtn").classList.remove("busy"); $("sendBtn").textContent="➤"; LS.write("convs",state.convs); scroll();
}
function tokMeta(u){
  if(!u||!u.completion_tokens) return "";
  return `<span>⏱ ${u.completion_tokens} tokens</span><span>⚡ ${u.est_tok_s||0} tok/s</span><span>🖥 ${u.device||""}</span>`;
}

          <div class="desc" style="margin:10px 0 6px">沙箱终端（在项目内执行命令）</div>
          <div class="box" style="margin-bottom:8px">
            <input type="text" id="cmdInput" placeholder="python src/main.py" style="flex:1;border:none;background:transparent" onkeydown="if(event.key==='Enter')runSandbox()">
            <button class="send" onclick="runSandbox()">执行</button>
          </div>
          <pre class="log" id="cmdOut" style="max-height:180px">（沙箱输出…）</pre>
        </div>
      </div>
    </div>`,
  agent:()=>`
    <div class="panel">
      <div class="sec">
        <h3>Agent 工作区</h3>
        <div class="desc">让模型真正动手：创建项目、读写文件、搜索、执行命令。所有操作限制在沙箱内。</div>
        <div class="frow"><div class="lbl">工作区根目录</div><span class="mono" id="wsRoot">–</span></div>
        <div class="frow"><div class="lbl">当前目录</div><span class="mono" id="wsCur">–</span></div>
        <div class="frow"><div class="lbl">可用工具</div><span class="mono" id="wsTools" style="font-size:11px">–</span></div>
      </div>
      <div class="sec">
        <h3>文件浏览</h3>
        <div class="frow"><input type="text" id="browsePath" value="." style="flex:1"><button class="btn" onclick="browse()">查看</button></div>
        <pre class="log" id="browseOut">（点击「查看」列出目录）</pre>
      </div>
      <div class="sec">
        <h3>Agent 指令</h3>
        <div class="desc">例如「创建一个项目『演示』，写个 Hello World 并运行」。</div>
        <div class="box" style="margin-bottom:10px">
          <textarea id="agentPrompt" rows="2" placeholder="用自然语言下达开发任务…"></textarea>
          <button class="send" id="agentBtn" onclick="runAgent()">执行</button>
        </div>
        <div id="agentSteps"></div>
        <pre class="log" id="agentOut" style="display:none"></pre>
      </div>
    </div>`,
  tiers:()=>`
    <div class="panel">
      <div class="sec">
        <h3>三层卸载运行方案</h3>
        <div class="desc">SSD → RAM → VRAM，由 Rust 内核实时计算。</div>
        <div class="frow"><div class="lbl">上下文长度</div>
          <div style="display:flex;gap:8px"><input type="text" id="ctxIn" value="8192" style="width:100px"><button class="btn primary" onclick="runPlan()">运行方案</button></div></div>
      </div>
      <div class="sec"><h3>分层结果</h3>
        <div class="stat-row"><span class="k"><span class="badge b-vram">VRAM</span> 热专家</span><span id="cVram">–</span></div>
        <div class="stat-row"><span class="k"><span class="badge b-ram">RAM</span> 次热 + 冷 KV</span><span id="cRam">–</span></div>
        <div class="stat-row"><span class="k"><span class="badge b-ssd">SSD</span> 全量 + 冷专家</span><span id="cSsd">–</span></div>
      </div>
      <div class="sec"><h3>性能预估</h3>
        <div class="stat-row"><span class="k">存储设备</span><span id="pSsd">–</span></div>
        <div class="stat-row"><span class="k">decode 上限</span><span id="pTok">–</span></div>
        <div class="stat-row"><span class="k">VRAM 占用</span><span id="pVram">–</span></div>
        <div class="bar"><i id="pVramBar" style="width:0%;background:var(--nvidia)"></i></div>
        <div class="stat-row"><span class="k">RAM 占用</span><span id="pRam">–</span></div>
        <div class="bar"><i id="pRamBar" style="width:0%;background:var(--npu)"></i></div>

  models:()=>`
    <div class="panel">
      <div class="sec">
        <h3>推荐模型</h3>
        <div class="desc">按加速硬件分组，点击卡片即可下载。每项标注模型介绍与推荐硬件规格。</div>
        <div id="catalog" class="catalog"></div>
      </div>
      <div class="sec"><h3>已安装模型</h3><div id="modelList"></div></div>
      <div class="sec"><h3>自定义下载</h3>
        <div class="frow"><input type="text" id="modelRepo" placeholder="owner/repo" style="flex:1"><button class="btn primary" onclick="downloadModel()">下载</button></div>
        <div class="desc mono" id="dlStatus" style="margin-top:10px"></div></div>
    </div>`,
  settings:()=>`
    <div class="panel">
      <div class="sec"><h3>加速设备</h3>
        <div class="desc">NVIDIA 走 llama.cpp CUDA；Intel GPU / NPU 走 OpenVINO。同一模型会自动选择对应后端的模型文件。</div>
        <div class="devs" id="devGrid"></div>
        <div class="desc" id="devHint" style="margin-top:10px"></div>
      </div>
      <div class="sec"><h3>推理源</h3>
        <div class="frow"><div class="lbl">使用外接 API<small>关闭时使用本地引擎</small></div>
          <div class="switch" id="swExternal" onclick="toggleExternal()"><i></i></div></div>
        <div id="extFields" style="display:none">
          <div class="frow"><div class="lbl">API Base URL</div><input type="text" id="extBase" placeholder="https://api.openai.com/v1"></div>
          <div class="frow"><div class="lbl">API Key</div><input type="password" id="extKey" placeholder="sk-..."></div>
          <div class="frow"><div class="lbl">模型名</div><input type="text" id="extModel" placeholder="gpt-4o-mini"></div>
        </div>
      </div>
      <div class="sec"><h3>OpenAI 兼容接口</h3>
        <div class="frow"><div class="lbl">服务地址</div><span class="mono" id="apiBase">–</span></div>

      </div>
      <div class="sec"><h3>关于</h3>
        <div class="desc">edge-infer · 三层卸载多硬件推理平台 v0.2.0<br>
        Rust 内核（edge-detect / edge-tiers / edge-prefetch / edge-engine）+ OpenVINO 推理服务。</div>
        <div class="frow"><div class="lbl">开发者</div><span>HelloVM</span></div>

async function loadProjects(){
  try{
    const j=await (await fetch(API+"/project/list")).json();
    $("projCur").textContent="当前："+(j.current||".");
    const box=$("projList"); box.innerHTML="";
    (j.projects||[]).forEach(p=>{
      const d=document.createElement("div"); d.className="frow";
      d.innerHTML=`<div class="lbl">📁 ${esc(p.name)}<small>${p.files} 文件${p.has_venv?" · 沙箱":""}</small></div>
        <div style="display:flex;gap:6px"><button class="btn" onclick="openProject('${esc(p.name)}')">打开</button>
        <button class="btn danger" onclick="delProject('${esc(p.name)}')">删除</button></div>`;
      box.appendChild(d);
    });
    if(!j.projects||!j.projects.length) box.innerHTML='<div style="color:var(--dim);font-size:12.5px">暂无项目。</div>';
    loadTree();
  }catch(e){ $("projList").innerHTML='<div style="color:var(--dim)">读取失败：'+esc(e.message)+'</div>'; }
}
async function delProject(name){
  if(!confirm(`删除项目「${name}」及其所有文件？此操作不可恢复。`)) return;
  try{ await fetch(API+"/project/delete?name="+encodeURIComponent(name),{method:"POST"}); toast("已删除 "+name); loadProjects(); }
  catch(e){ toast("删除失败："+e.message); }
}
async function createProject(){
  const name=$("newProjName").value.trim(); if(!name){toast("请输入项目名");return}
  const tpl=$("newProjTpl").value;
  try{ const j=await (await fetch(API+"/project/create?name="+encodeURIComponent(name)+"&template="+tpl,{method:"POST"})).json();
    toast(j.message||"已创建"); $("newProjName").value=""; loadProjects();
  }catch(e){ toast("创建失败："+e.message); }
}
async function openProject(name){ try{ await fetch(API+"/project/open?name="+encodeURIComponent(name),{method:"POST"}); toast("已打开 "+name); loadProjects(); }catch(e){} }
async function loadTree(){
  const cur=($("projCur").textContent||"").replace("当前：","")||".";
  try{ const j=await (await fetch(API+"/project/tree?path="+encodeURIComponent(cur))).json();
    $("fileTree").innerHTML=renderTree(j.tree||[],0); }catch(e){ $("fileTree").textContent="读取失败："+e.message; }
}
function renderTree(nodes,depth){
  let h="";
  nodes.forEach(n=>{
    const pad=8+depth*14;
    if(n.type==="dir"){ h+=`<div style="padding:4px 0 4px ${pad}px;color:var(--dim)">📁 ${esc(n.name)}${n.skipped?" (跳过)":""}</div>`; if(n.children) h+=renderTree(n.children,depth+1); }
    else h+=`<div style="padding:4px 0 4px ${pad}px;cursor:pointer" onclick="openFile('${esc(n.path)}')">📄 ${esc(n.name)} <span style="color:var(--dim);font-size:11px">${n.size||0}B</span></div>`;
  });
  return h;
}
async function openFile(path){ try{ const j=await (await fetch(API+"/project/file?path="+encodeURIComponent(path))).json();
  $("fileEditor").value=j.content||""; $("editPath").textContent=path; $("saveBtn").disabled=false; $("fileEditor").dataset.path=path;
}catch(e){ toast("打开失败："+e.message); } }
async function saveFile(){ const path=$("fileEditor").dataset.path; if(!path) return;
  try{ await fetch(API+"/project/file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path,content:$("fileEditor").value})});
    toast("已保存 "+path); loadTree(); }catch(e){ toast("保存失败："+e.message); } }
async function runSandbox(){ const cmd=$("cmdInput").value.trim(); if(!cmd) return;
  $("cmdOut").textContent="$ "+cmd+"\n运行中…";
  try{ const j=await (await fetch(API+"/agent/sandbox_run?cmd="+encodeURIComponent(cmd),{method:"POST"})).json();
    $("cmdOut").textContent="$ "+cmd+"\n"+(j.output||JSON.stringify(j)); loadTree(); }catch(e){ $("cmdOut").textContent="失败："+e.message; } }

async function loadWs(){ try{ const j=await (await fetch(API+"/agent/workspace")).json();
  $("wsRoot").textContent=j.root; $("wsCur").textContent=j.current; $("wsTools").textContent=(j.tools||[]).join(", ");
}catch(e){ $("wsRoot").textContent="(Agent 不可用)"; } }
async function browse(){ const p=$("browsePath").value||".";
  try{ const j=await (await fetch(API+"/agent/list?path="+encodeURIComponent(p))).json(); $("browseOut").textContent=j.content||JSON.stringify(j); }catch(e){ $("browseOut").textContent="失败："+e.message; } }
async function runAgent(){ const t=$("agentPrompt").value.trim(); if(!t) return;
  $("agentBtn").disabled=true; $("agentSteps").innerHTML=""; $("agentOut").style.display="block"; $("agentOut").textContent="运行中…";
  try{ const j=await (await fetch(API+"/agent/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t,max_steps:6})})).json();
    $("agentSteps").innerHTML=(j.steps||[]).map(s=>`<div class="step"><span class="t">🔧 ${esc(s.tool)}</span>(${esc(JSON.stringify(s.arguments))})<br>${esc(s.result)}</div>`).join("");
    $("agentOut").textContent=j.answer||"(无回答)"; loadProjects&&loadTree();
  }catch(e){ $("agentOut").textContent="失败："+e.message; } $("agentBtn").disabled=false; }

async function runPlan(){
  const ctx=Number(($("ctxIn")||{}).value||8192);
  try{ const r=await fetch(API+"/edge/run_plan?context="+ctx+"&large_threshold_gb=8");
    if(!r.ok){ $("pSummary").textContent="内核不可用："+(await r.text()).slice(0,120); return; }
    const p=await r.json(); const a=p.allocation, from={}; a.experts.forEach(e=>{from[e.tier]=(from[e.tier]||0)+1});
    $("cVram").textContent=from.Vram||0; $("cRam").textContent=from.Ram||0; $("cSsd").textContent=from.Ssd||0;
    $("pVram").textContent=fmtGB(a.vram_used_bytes); $("pRam").textContent=fmtGB(a.ram_used_bytes);
    $("pCtx").textContent=a.effective_context; $("pOom").textContent=a.oom_fallback?"是":"否";
    $("pOom").style.color=a.oom_fallback?"var(--warn)":"var(--ok)";
    $("pTok").textContent=p.est_decode_tok_s!=null?(p.est_decode_tok_s.toFixed(1)+" tok/s（受硬盘限制）"):"不受硬盘限制";
    $("pVramBar").style.width=Math.min(100,(a.vram_used_bytes/6e9)*100)+"%";
    $("pRamBar").style.width=Math.min(100,(a.ram_used_bytes/1e10)*100)+"%";
    $("pSummary").textContent=p.summary.join("\n");
    const dv=await (await fetch(API+"/edge/devices")).json(); if(dv.storage) $("pSsd").textContent=dv.storage.note;
  }catch(e){ $("pSummary").textContent="调用失败："+e.message; }
}
async function loadModels(){ try{ const j=await (await fetch(API+"/edge/models")).json(); const box=$("modelList");
  if(!j.models||!j.models.length){ box.innerHTML='<div style="color:var(--dim)">未发现本地模型</div>'; return; }
  box.innerHTML=j.models.map(m=>{ const b=m.npu_compatible?'<span class="badge b-ram">NPU 可用</span>':'<span class="badge b-ssd">仅 CPU/GPU</span>';
    return `<div class="frow"><div class="lbl">${esc(m.id)}<small>${esc(m.note)} · ${m.size}</small></div>${b}</div>`; }).join("");
}catch(e){ $("modelList").innerHTML='<div style="color:var(--dim)">读取失败：'+esc(e.message)+'</div>'; } }

const DEV_LABEL={nvidia:["NVIDIA GPU","var(--nvidia)","#76b900"],"intel-gpu":["Intel GPU","var(--cpu)","#8b5cf6"],npu:["Intel NPU","var(--npu)","#2f8fff"]};
async function loadCatalog(){
  const box=$("catalog"); if(!box) return;
  box.innerHTML='<div style="color:var(--dim);font-size:12.5px">加载推荐模型…</div>';
  try{
    const j=await (await fetch(API+"/edge/catalog")).json();
    const cat=j.catalog||{};
    box.innerHTML=Object.entries(cat).map(([dev,items])=>{
      const [label,color,hex]=DEV_LABEL[dev]||[dev,"var(--brand)","#2f6bff"];
      const cards=(items||[]).map(m=>{
        const filesAttr = m.files ? esc(m.files.join(",")) : "";
        const mmTag = m.mm?'<span class="tg">多模态</span>':'';
        const actTag = m.active && m.active!==m.params ? `<span class="tg">激活 ${m.active}</span>`:'';
        return `<div class="mcard" onclick="downloadCatalog('${esc(m.repo)}','${filesAttr}',this)" title="点击下载 ${esc(m.repo)}">
          ${m.installed?'<span class="installed">✓ 已安装</span>':''}
          <div class="mt">${esc(m.name)}</div>
          <div class="ms">${esc(m.repo)}</div>
          <div class="mtags"><span class="tg">${m.params}</span>${actTag}<span class="tg">${m.quant}</span><span class="tg">${m.size_gb} GB</span>${mmTag}</div>
          <div class="mh">🧩 推荐规格：${esc(m.ram_hint||"")}</div>
          <div class="ms" style="margin-top:6px">${esc(m.note)}</div>
        </div>`;
      }).join("");
      return `<div class="catcol"><div class="ch"><span class="dot" style="background:${color}"></span>${label}</div><div class="cb">${cards}</div></div>`;
    }).join("");
  }catch(e){ box.innerHTML='<div style="color:var(--dim)">加载失败：'+esc(e.message)+'</div>'; }
}
async function downloadCatalog(repo, files, el){
  if(el && el.querySelector(".installed")){ toast("该模型已安装"); return; }
  if(el) el.classList.add("loading");
  try{
    const f = files ? "&files="+encodeURIComponent(files) : "";
    await (await fetch(API+"/edge/download?repo="+encodeURIComponent(repo)+f,{method:"POST"})).json();
    toast("已开始下载 "+repo.split("/").pop()+"（体积较大，请耐心等待）");
    const st=$("dlStatus"); if(st) st.textContent="下载中："+repo;
  }catch(e){ toast("下载请求失败："+e.message); if(el) el.classList.remove("loading"); }
}
async function downloadModel(){ const repo=$("modelRepo").value.trim(); if(!repo){toast("请输入仓库 ID");return}
  $("dlStatus").textContent="请求下载 "+repo+" …";
  try{ const j=await (await fetch(API+"/edge/download?repo="+encodeURIComponent(repo),{method:"POST"})).json(); $("dlStatus").textContent=j.message||JSON.stringify(j); toast("下载已提交"); loadModels(); }catch(e){ $("dlStatus").textContent="失败："+e.message; } }

function initSettings(){
  $("swExternal").classList.toggle("on",state.useExternal);
  $("extFields").style.display=state.useExternal?"block":"none";
  $("extBase").value=state.ext.base||""; $("extKey").value=state.ext.key||""; $("extModel").value=state.ext.model||"";
  ["extBase","extKey","extModel"].forEach(id=>$(id).onchange=()=>{ state.ext={base:$("extBase").value,key:$("extKey").value,model:$("extModel").value}; LS.write("ext",state.ext); });
  $("apiBase").textContent=API;
  renderDevGrid();
}
async function renderDevGrid(){
  let npu=false, devs=[];
  try{ const j=await (await fetch(API+"/edge/devices")).json(); devs=j.openvino_devices||[]; npu=devs.includes("NPU"); }catch(e){}
  const grid=$("devGrid"); if(!grid) return; grid.innerHTML="";
  [{id:"auto",nm:"自动选择",cap:"按模型规模自动路由",tag:"推荐",color:"var(--brand)"},
   {id:"NVIDIA-GPU",nm:"NVIDIA GPU",cap:"CUDA · 实测比 OpenVINO 快约 20×",tag:"CUDA",color:"var(--nvidia)"},
   {id:"NPU",nm:"Intel NPU",cap:"OpenVINO · 低功耗小模型",tag:npu?"可用":"未检测",color:"var(--npu)"},
   {id:"Intel-GPU",nm:"Intel GPU",cap:"OpenVINO · Arc 核显加速",tag:devs.some(d=>d.startsWith("GPU"))?"可用":"未检测",color:"var(--cpu)"},
   {id:"CPU",nm:"CPU",cap:"通用回退",tag:"保底",color:"#64748b"}].forEach(o=>{
    const d=document.createElement("div"); d.className="dev"+(state.device===o.id?" sel":"");
    d.innerHTML=`<span class="tag">${o.tag}</span><div class="nm"><span class="dot" style="background:${o.color}"></span>${o.nm}</div><div class="cap">${o.cap}</div>`;
    d.onclick=()=>selectDevice(o.id,o.nm); grid.appendChild(d);
  });
  $("devHint").textContent="当前后端设备："+(state.loadedDevice||state.device);
}
async function selectDevice(id,name){
  state.device=id; LS.write("device",id); renderDevGrid();
  try{ const j=await (await fetch(API+"/edge/device/set?device="+encodeURIComponent(id),{method:"POST"})).json();
    toast("已切换设备："+name); loadDeviceChip();
  }catch(e){ toast("切换失败："+e.message); }
}
function toggleExternal(){ state.useExternal=!state.useExternal; LS.write("useExternal",state.useExternal);
  $("swExternal").classList.toggle("on",state.useExternal); $("extFields").style.display=state.useExternal?"block":"none"; }

(function init(){
  $("streamOn").checked=state.stream; $("thinkOn").checked=state.thinking; $("agentOn").checked=state.agentMode;
  $("streamOn").onchange=()=>{state.stream=$("streamOn").checked;LS.write("stream",state.stream)};
  $("thinkOn").onchange=()=>{state.thinking=$("thinkOn").checked;LS.write("thinking",state.thinking)};
  $("agentOn").onchange=()=>{state.agentMode=$("agentOn").checked;LS.write("agentMode",state.agentMode)};
  if(state.convs.length) state.curConv=state.convs[state.convs.length-1].id;
  renderConvs(); renderChat(); renderAtts();
  bootService();
  loadModelsForPicker();
  setInterval(()=>{loadHealth();loadDeviceChip();},15000);
})();

async function bootService(){
  const dot=$("footDot"), txt=$("footText");
  dot.style.background="var(--warn)"; txt.textContent="正在启动推理服务…";
  $("chipSvc").textContent="正在启动…"; $("chipSvc").className="chip";
  if(await probeAPI()){ loadHealth(); loadDeviceChip(); return; }
  if(IS_TAURI){
    txt.textContent="正在启动推理服务（首次加载模型较慢）…";
    askTauriStart();
    for(let i=0;i<50;i++){
      await new Promise(r=>setTimeout(r,2000));
      if(await probeAPI()){ loadHealth(); loadDeviceChip(); toast("推理服务已就绪"); return; }
    }
  }
  dot.style.background="var(--err)";
  txt.innerHTML='服务未运行 · <span style="color:var(--brand);cursor:pointer" onclick="bootService()">点此重试</span>';
  $("chipSvc").textContent="未连接"; $("chipSvc").className="chip off";
}
</script>
</body>
</html>
