[workspace]
resolver = "2"
members = [
    "crates/edge-detect",
    "crates/edge-tiers",
    "crates/edge-prefetch",
    "crates/edge-engine",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "LicenseRef-EdgeInfer-Dual"
authors = ["David"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
